services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lu_links
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lu_links"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lu-links-pg:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@db:5432/lu_links?sslmode=disable
      - up

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./db/test-data.json:/data/test-data.json:ro
    command:
      - -file=/data/test-data.json
      - -dsn=postgres://postgres:postgres@db:5432/lu_links?sslmode=disable
      - -if-empty

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    # App secrets come from .env (format: raw). Compose still reads `.env` for
    # YAML interpolation unless COMPOSE_DISABLE_ENV_FILE=1 (see Makefile).
    env_file:
      - path: .env
        format: raw
        required: true
    environment:
      APP_ENV: development
      PORT: "8080"
      SITE_BASE_URL: http://localhost:8080
      # Hostname `db` is the Compose Postgres service — not 127.0.0.1 inside this container.
      LOCAL_DATABASE_URL: postgres://postgres:postgres@db:5432/lu_links?sslmode=disable
    dns:
      - 8.8.8.8
      - 1.1.1.1
    develop:
      # Full image rebuild (~30–40s). Compose only debounces ~500ms, so
      # watching `.` queues a new rebuild for every save that lands while a
      # build is already running (looks like 2–3 restarts per change).
      # Watch only paths that affect the app image; ignore editor/test/data noise.
      watch:
        - action: rebuild
          path: ./cmd/server
        - action: rebuild
          path: ./internal
          ignore:
            - "**/*_test.go"
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
        - action: rebuild
          path: ./Dockerfile

volumes:
  lu-links-pg:
